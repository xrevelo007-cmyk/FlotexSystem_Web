<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlotexSystem — Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        iosBg: '#000000',
                        iosCard: '#1C1C1E',
                        iosBorder: '#2C2C2E',
                        iosBlue: '#0A84FF',
                        iosBlueHover: '#0066CC',
                        iosTextGray: '#8E8E93'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-iosBg text-white font-sans antialiased min-h-screen flex flex-col justify-between">
    <main class="flex-grow flex items-center justify-center p-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="text-center py-4 text-xs text-[#636366]">
        © 2026 FlotexSystem — Xavier Revelo<br>All rights reserved
    </footer>
</body>
</html>
