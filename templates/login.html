{% extends "base.html" %}
{% block content %}
<div class="w-full max-w-md bg-iosCard border border-iosBorder rounded-[28px] p-8 shadow-2xl text-center">
    <div class="text-5xl mb-2">⚡</div>
    <h1 class="text-2xl font-bold tracking-tight text-white mb-1">FlotexSystem</h1>
    <p class="text-sm text-iosTextGray mb-6">Inicia sesión para continuar</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="mb-4 p-3 rounded-xl text-xs font-medium {% if category == 'error' %}bg-red-950 text-red-400 border border-red-800{% else %}bg-green-950 text-green-400 border border-green-800{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/" method="POST" class="space-y-4">
        <div>
            <input type="text" name="usuario" placeholder="Usuario / Cédula" required
                class="w-full h-12 px-4 rounded-xl bg-[#2C2C2E] border border-[#3A3A3C] text-white placeholder-iosTextGray focus:outline-none focus:border-iosBlue text-sm">
        </div>
        <div>
            <input type="password" name="password" placeholder="Contraseña" required
                class="w-full h-12 px-4 rounded-xl bg-[#2C2C2E] border border-[#3A3A3C] text-white placeholder-iosTextGray focus:outline-none focus:border-iosBlue text-sm">
        </div>
        <div>
            <button type="submit" 
                class="w-full h-12 bg-iosBlue hover:bg-iosBlueHover text-white font-bold rounded-2xl transition duration-200 text-sm shadow-lg">
                Iniciar Sesión
            </button>
        </div>
    </form>
</div>
{% endblock %}
